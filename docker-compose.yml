name: ai-tour-guide

services:
  pgvector:
    # PG18 + vector/hstore/uuid-ossp 扩展镜像内置；application 启动时自动建表，无需手工 DDL
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg18}
    container_name: ai-pgvector   # 固定名：兼容既有文档/记忆里的 docker exec ai-pgvector 命令
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_tour_guide
      # 与 .env 的 PG_PASSWORD 同源，服务器上换强口令即可，两处保持一致
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: Asia/Shanghai
    # PG18 数据目录在 /var/lib/postgresql/18/docker，卷必须挂在上一层，挂 data 子目录会 crash loop
    volumes:
      - pgvector_data:/var/lib/postgresql
    ports:
      # 仅回环，IDEA/psql 直连用；公网不可达
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_tour_guide"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [appnet]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME_IMAGE: ${BACKEND_RUNTIME_IMAGE:-eclipse-temurin:21-jre-alpine}
    restart: unless-stopped
    env_file: .env
    environment:
      # 覆盖 .env 里指向 localhost 的开发库地址，容器网络内走服务名；账号密码仍由 env_file 注入
      PG_URL: "jdbc:postgresql://pgvector:5432/ai_tour_guide"
      TZ: Asia/Shanghai
      # 堆上限约为容器可见内存的 55%，OOM 时退出交由 restart 策略拉起而非僵死
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=55.0 -XX:+ExitOnOutOfMemoryError"
    depends_on:
      pgvector:
        condition: service_healthy
    # 仅回环调试口，公网不可达；应急排查用 curl 127.0.0.1:18123/api/health
    ports:
      - "127.0.0.1:18123:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/api/health | grep -q ok"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks: [appnet]

  frontend:
    build:
      context: ./ai-tour-guide-frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${FRONTEND_NODE_IMAGE:-node:22-alpine}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # 宝塔网站反向代理的目标地址：http://127.0.0.1:18080
    ports:
      - "127.0.0.1:18080:80"
    networks: [appnet]

volumes:
  pgvector_data:
    # 复用本地既有的数据卷（手动创建的 ai_pgvector_data）；服务器上先 `docker volume create ai_pgvector_data` 再起 compose
    name: ai_pgvector_data
    external: true

networks:
  appnet:
    driver: bridge
