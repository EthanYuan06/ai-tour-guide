spring:
  application:
    name: ai-tour-guide
  config:
    # 把项目根目录的 .env 当作 properties 文件导入（KEY=VALUE、# 注释），文件不存在时不报错
    import: optional:file:./.env[.properties]
  datasource:
    url: ${PG_URL}
    username: ${PG_USERNAME}
    password: ${PG_PASSWORD}
  mvc:
    async:
      # 流式对话运行在 MVC 异步模式，容器默认 30s 空闲切断长回复
      request-timeout: 300000
  ai:
    chat:
      memory:
        repository:
          jdbc:
            # 启动时执行 jar 内置 schema-postgresql.sql 自动建表（CREATE TABLE IF NOT EXISTS，幂等）
            initialize-schema: always
    retry:
      max-attempts: 3
    model:
      chat: openai
      embedding: dashscope
    # DashScope 嵌入独立配置区（Spring AI Alibaba 官方 dashscope-embeddings 文档）
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      embedding:
        options:
          model: qwen3.7-text-embedding-flash
          # 必须与 vectorstore.pgvector.dimensions 一致，否则入库报 22000 vector type mismatch
          dimensions: 1024
          text-type: document
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000
        initialize-schema: true
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: ${AI_TOUR_GUIDE_CHAT_MODEL:deepseek-v4.1-flash}
          temperature: 0.75
          max-tokens: 6000
          # 开启流式输出回传 usage，方便统计 token 消耗
          stream-usage: true
          # 百炼 DeepSeek 系列默认开思考模式，同步接口需关闭以控制延迟与成本
          extra-body:
            "[enable_thinking]": false
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yuluo.tourguide.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
