spring:
  application:
    name: ai-tour-guide
  config:
    # 把项目根目录的 .env 当作 properties 文件导入（KEY=VALUE、# 注释），文件不存在时不报错
    import: optional:file:./.env[.properties]
  ai:
    retry:
      # 默认 max-attempts=10 且指数退避，同步接口异常时会长时间挂起，收敛为 3 次
      max-attempts: 3
    model:
      # 显式开启 OpenAI 兼容协议下的 Chat 自动装配
      chat: openai
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: ${AI_TOUR_GUIDE_CHAT_MODEL:deepseek-v4.1-flash}
          # 官方建议 0.7~0.8，作为语气锚点
          temperature: 0.75
          # 长行程容易被截断，放大输出上限
          max-tokens: 6000
          # 百炼 DeepSeek 系列默认开思考模式，同步接口需关闭以控制延迟与成本
          extra-body:
            "[enable_thinking]": false
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yuluo.tourguide.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
